server {
    listen 3010;
    server_name localhost;

    root /opt/app;

    # Canonicalize to the non-www host with a 301. Generic on purpose: it
    # strips a leading "www." from whatever Host the ingress forwards, so the
    # image stays environment-independent (no domain is hardcoded). Internal
    # health probes hit the service by name/IP and never match, so they pass
    # through untouched.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    # Disable directory indexing
    autoindex off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' www.gravatar.com; style-src-elem 'self' fonts.googleapis.com; font-src 'self' fonts.gstatic.com" always;
    }

    location ~* \.(txt|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000";
    }
}