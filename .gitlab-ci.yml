stages:
  - test

linter:
  stage: test
  image: node:24-alpine
  script:
    - yarn --frozen-lockfile
    - yarn run lint

types check:
  stage: test
  image: node:24-alpine
  script:
    - yarn --frozen-lockfile
    - yarn run tsc

integration tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.57.0-jammy
  script:
    - yarn --frozen-lockfile
    - yarn run test:integration
